schema-version: 1
# 首次部署仅报告；自动恢复可选 restart-cooldown，显式即时到期可选 expire-now。
strategy: report-only
scan-on-startup: true
observe-time: true
# 空列表表示所有世界；非空时只接受完整 UUID。
enabled-worlds: []
tolerance-ticks: 200
max-candidate-buffer-per-chunk: 4096
max-pending-chunks: 4096
max-in-flight-chunks: 8
dispatch-chunks-per-tick: 8
candidates-per-slice: 16
slice-soft-budget-ms: 2
max-loaded-scan-chunks: 65536
audit:
  enabled: true
  queue-capacity: 8192
